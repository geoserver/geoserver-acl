# Builds and pushes docker images on main and tags

name: Build and test
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  lint:
    name: Validate source code formatting
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'
    - run: |
        make lint

  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      matrix:
        java-version: [ 17, 21, 25 ]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
        cache: 'maven'

    - name: Build without tests
      run: |
        make package

    - name: Test
      run: |
        make test

    - name: Setup Python
      if: matrix.java-version == 21
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Test python client
      if: matrix.java-version == 21
      run: |
        make test-python-client

    - name: Build docker image
      run: |
        make build-image

    - name: Test python example
      if: matrix.java-version == 21
      run: |
        make test-python-example

    - name: Build and run java example
      run: |
        make test-java-example

