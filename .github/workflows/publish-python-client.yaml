# Publishes the python client to PyPI on release tags. The wheel version comes
# from `make show-version`, which resolves the exact git tag when the ref is a
# release tag. A workflow_dispatch on a branch exercises the build and test jobs
# without publishing (the publish job only runs for tag refs).
name: Publish Python client
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'geoserver/geoserver-acl'
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Package
      run: make package
    - name: Test python client
      run: make test-python-client
    - name: Build sdist and wheel
      run: make dist-python-client
    - name: Upload dist
      uses: actions/upload-artifact@v7
      with:
        name: python-client-dist
        path: src/infrastructure/web-api/v1/clients/python/target/dist/
        if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: python-client-dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
